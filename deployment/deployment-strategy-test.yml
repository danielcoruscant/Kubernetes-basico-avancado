apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: dp-test-debug
  name: dp-test
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 10%
  selector:
    matchLabels:
      app: dp-test
  template:
    metadata:
      labels:
        app: dp-test
    spec:
      containers:
      - image: nginx
        name: nginx

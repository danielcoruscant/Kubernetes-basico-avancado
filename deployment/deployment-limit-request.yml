apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: dp-limit-request
  name: dp-limit-request
  namespace: application
spec:
  replicas: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 5%
      maxSurge: 10%
  selector:
    matchLabels:
      app: dp-limit-request
  template:
    metadata:
      labels:
        app: dp-limit-request
    spec:
      containers:
      - image: nginx
        name: nginx
        resources:
          limits:
            cpu: "500m"
            memory: "2G"
          requests:
            cpu: "250m"
            memory: "250M"

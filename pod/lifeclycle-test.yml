apiVersion: v1
kind: Pod
metadata:
  name: pod-lifecycle-test
spec:
  terminationGracePeriodSeconds: 70
  containers:
    - name: my-container-nginx
      image: nginx
      ports:
        - containerPort: 80
      command: ["sleep", "infinity"]
      lifecycle:
        preStop:
          exec:
            command: ["sh", "-c", "curl http://10.244.3.9:80"]
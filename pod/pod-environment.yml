apiVersion: v1
kind: Pod
metadata:
  name: pod-environment
spec:
  containers:
    - name: container-environment
      image: busybox
      command: ["sleep", "infinity"]
      env:
        - name: ENVIRONMENT
          value: "development"
        - name: DEBUG
          value: "true"
        - name: LOG_LEVEL
          value: "debug"
        - name: FEATURE_FLAG
          value: "true"
        - name: API_URL
          value: "https://api.example.com"
        - name: TIMEOUT
          value: "30s"
        - name: RETRY_COUNT
          value: "3"
        - name: CACHE_ENABLED
          value: "true"
        - name: MAX_CONNECTIONS
          value: "100"
        - name: MIN_CONNECTIONS
          value: "10"
        - name: LOG_FILE
          value: "/var/log/app.log"
        - name: LOG_FORMAT
          value: "json"
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-map-test
  labels:
    app: apache-cm-test
  annotations:
    kubectl.kubernetes.io/last-applied-configuration: "false"
data:
  example.property.1: "value1"
  example.property.2: "value2"
  index.html: |
    <html>
      <head>
        <title>ConfigMap Test</title>
      </head>
      <body>
        <h1>ConfigMap Test Page</h1>
      </body>
    </html>
  vhost-app2.conf: |
    server {
      listen 80;
      server_name app-2.local;
      root /usr/share/nginx/html/app-2;
      index index.html;
      location / {
        try_files $uri $uri/ =404;
      }
    }